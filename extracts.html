<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المستخلصات</title>
<style>
:root{--navy:#0f2547;--orange:#f37021;--bg:#eef1f5;--card:#fff;--text:#14213d;--muted:#6b7280;--border:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162036;--text:#f9fafb;--muted:#9ca3af;--border:#374151}}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:16px;border-bottom:4px solid var(--orange)}
header h1{margin:0;font-size:22px}
main{max-width:520px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select{width:100%;padding:10px;font-size:15px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{width:100%;margin-top:10px;padding:12px;font-size:15px;border:0;border-radius:8px;background:var(--orange);color:#fff;font-weight:700}
button.s{background:transparent;color:var(--orange);border:2px solid var(--orange)}
button.x{background:#b91c1c;color:#fff;border:0}
.m{color:var(--muted);font-size:13px;margin-top:6px}
.t{font-weight:700;font-size:16px;margin-top:6px}
#msg{display:none;padding:10px;border-radius:8px;margin-bottom:10px}
#pr{display:none}
#pr table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
#pr th,#pr td{border:1px solid #444;padding:3px;text-align:center}
#pr th{background:#dbeafe}
#pr h3{margin:8px 0 4px}
.sig{display:flex;justify-content:space-around;margin-top:40px;font-size:13px}
@page{size:A4 landscape;margin:10mm}
@media print{header,#app,a,#msg{display:none!important}body{background:#fff;color:#000}#pr{display:block}}
</style></head><body>
<header><h1>المستخلصات</h1></header>
<main><div id="msg"></div><div id="app">جاري التحميل...</div>
<a href="index.html" style="color:var(--orange)">الرجوع للتطبيق</a><div id="pr"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var db=supabase.createClient("https://ymmyijtuaqkiyjenmgjh.supabase.co","sb_publishable_0T07DGMMB6Owg10Sl6zHyw_2PZLAgBL");
var app=document.getElementById("app"),ex=null,cid=null,eid=null,cos=[];
function n(v){return parseFloat(v)||0}
function f(v){return v.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function err(t,ok){var m=document.getElementById("msg");m.textContent=t;m.style.background=ok?"#e1f5e7":"#fde8e8";m.style.color=ok?"#14532d":"#9b1c1c";m.style.display="block";window.scrollTo(0,0);setTimeout(function(){m.style.display="none"},6000)}
function blank(){return{d:"",u:"",q:"",p:"0",pc:"",pr:""}}
function rc(r){var e=n(r.q)*n(r.pc)/100,c=e-n(r.p);return{e:e,c:c,v:e*n(r.pr),pv:c*n(r.pr)}}
function sum(a,k){return a.reduce(function(s,r){return s+rc(r)[k]},0)}
function gross(){return sum(ex.works,"pv")+sum(ex.extras,"pv")}
function dv(r){return r.t=="p"?gross()*n(r.a)/100:n(r.a)}
function ded(){return ex.deds.reduce(function(s,r){return s+dv(r)},0)}
function net(){return gross()-ded()}
function cum(){return sum(ex.works,"v")+sum(ex.extras,"v")}

async function init(){
  var s=await db.auth.getSession();
  if(!s.data.session){app.textContent="سجّل دخول من التطبيق الأول.";return}
  var u=s.data.session.user.id,m={};
  var a=await db.from("companies").select("id,name").eq("owner_id",u);
  (a.data||[]).forEach(function(c){m[c.id]=c});
  var t=await db.from("company_team").select("company_id").eq("user_id",u);
  var ids=(t.data||[]).map(function(x){return x.company_id}).filter(function(i){return !m[i]});
  if(ids.length){var b=await db.from("companies").select("id,name").in("id",ids);(b.data||[]).forEach(function(c){m[c.id]=c})}
  cos=Object.keys(m).map(function(k){return m[k]});
  if(!cos.length){app.textContent="لازم يكون عندك شركة الأول (من إضافة شركة في التطبيق).";return}
  cid=cos[0].id;list()
}
async function list(){
  ex=null;eid=null;
  var r=await db.from("extracts").select("id,title,created_at").eq("company_id",cid).order("created_at",{ascending:false});
  var h='<div class="card"><h2>الشركة</h2><select id="co">'+cos.map(function(c){return'<option value="'+c.id+'"'+(c.id==cid?" selected":"")+'>'+esc(c.name)+'</option>'}).join("")+'</select><button data-act="new">+ مستخلص جديد</button></div><div class="card"><h2>المستخلصات المحفوظة</h2>';
  if(r.error)h+='<div class="m">'+esc(r.error.message)+'</div>';
  else if(!r.data.length)h+='<div class="m">لا توجد مستخلصات.</div>';
  else r.data.forEach(function(x){h+='<button class="s" data-open="'+x.id+'">'+esc(x.title||"مستخلص")+' - '+x.created_at.slice(0,10)+'</button>'});
  app.innerHTML=h+'</div>'
}
function fld(s,i,k,l,v,t){return'<div><label>'+l+'</label><input type="'+t+'" '+(t=="number"?'inputmode="decimal" ':'')+'data-s="'+s+'" data-i="'+i+'" data-k="'+k+'" value="'+esc(v)+'"></div>'}
function rowH(s,i,r){return'<div class="card"><div class="g"><div style="grid-column:1/3">'+fld(s,i,"d","وصف البند",r.d,"text")+'</div>'+fld(s,i,"u","الوحدة",r.u,"text")+fld(s,i,"q","الكمية الإجمالية",r.q,"number")+fld(s,i,"p","الكمية السابقة",r.p,"number")+fld(s,i,"pc","النسبة المنفذة %",r.pc,"number")+fld(s,i,"pr","الفئة (سعر الوحدة)",r.pr,"number")+'</div><div class="m" id="c_'+s+i+'"></div><button class="s" data-del="'+s+':'+i+'">حذف البند</button></div>'}
function hf(k,l,t){return'<div><label>'+l+'</label><input type="'+(t||"text")+'" '+(t=="number"?'inputmode="decimal" ':'')+'data-h="'+k+'" value="'+esc(ex[k])+'"></div>'}
function dedH(r,i){return'<div class="card"><div class="g">'+fld("deds",i,"d","البيان",r.d,"text")+fld("deds",i,"a","المبلغ أو النسبة",r.a,"number")+'<div style="grid-column:1/3"><label>النوع</label><select data-s="deds" data-i="'+i+'" data-k="t"><option value="v">مبلغ ثابت</option><option value="p"'+(r.t=="p"?" selected":"")+'>نسبة % من قيمة الفترة</option></select></div></div><div class="m" id="c_deds'+i+'"></div><button class="s" data-del="deds:'+i+'">حذف</button></div>'}
function draw(){
  var h='<div class="card"><h2>بيانات المستخلص</h2><div class="g">'+hf("no","رقم المستخلص")+hf("date","التاريخ","date")+hf("project","المشروع")+hf("contractor","المقاول")+'</div></div>';
  h+='<div class="card"><h2>بيانات العقد</h2><div class="g">'+hf("client","صاحب العمل")+hf("cno","رقم العقد")+hf("cval","قيمة العقد","number")+hf("cdate","تاريخ العقد","date")+'</div></div>';
  [["works","الأعمال التعاقدية"],["extras","أعمال إضافية"]].forEach(function(S){
    h+='<h2>'+S[1]+'</h2>';ex[S[0]].forEach(function(r,i){h+=rowH(S[0],i,r)});
    h+='<button class="s" data-add="'+S[0]+'">+ إضافة بند</button>'});
  h+='<h2 style="margin-top:14px">الخصومات</h2>';
  ex.deds.forEach(function(r,i){h+=dedH(r,i)});
  h+='<button class="s" data-add="deds">+ إضافة خصم</button><button class="s" data-pre="ضمان أعمال|p">+ ضمان أعمال (نسبة)</button><button class="s" data-pre="دفعة مقدمة|v">+ دفعة مقدمة (مبلغ)</button>';
  h+='<div class="card" id="tot" style="margin-top:12px"></div>';
  h+='<button data-act="save">حفظ</button>';
  if(eid)h+='<button class="s" data-act="next">مستخلص تاني من ده</button>';
  h+='<button class="s" data-act="print">طباعة / PDF</button><button class="s" data-act="xlsx">تصدير Excel</button><button class="s" data-act="back">رجوع</button>';
  if(eid)h+='<button class="x" data-act="rm">مسح المستخلص</button>';
  app.innerHTML=h;upd()
}
function upd(){
  ["works","extras"].forEach(function(s){ex[s].forEach(function(r,i){var c=rc(r),el=document.getElementById("c_"+s+i);if(el)el.textContent="المنفذة "+f(c.e)+" | الحالية "+f(c.c)+" | قيمة الفترة "+f(c.pv)+" | الإجمالي "+f(c.v)})});
  ex.deds.forEach(function(r,i){var el=document.getElementById("c_deds"+i);if(el)el.textContent="قيمة الخصم: "+f(dv(r))});
  var t='<div>أعمال تعاقدية (الفترة): '+f(sum(ex.works,"pv"))+'</div><div>أعمال إضافية (الفترة): '+f(sum(ex.extras,"pv"))+'</div><div>إجمالي قيمة الفترة: '+f(gross())+'</div><div>إجمالي الخصومات: '+f(ded())+'</div><div class="t">صافي المستحق: '+f(net())+'</div><div class="m">إجمالي الأعمال المنفذة للآن: '+f(cum())+'</div>';
  if(n(ex.cval)>0)t+='<div class="m">نسبة إنجاز العقد: '+(cum()/n(ex.cval)*100).toFixed(1)+'%</div>';
  document.getElementById("tot").innerHTML=t
}
async function save(){
  var row={company_id:cid,title:"مستخلص "+(ex.no||"")+" - "+(ex.project||""),data:ex,updated_at:new Date().toISOString()};
  var r=eid?await db.from("extracts").update(row).eq("id",eid).select("id").single():await db.from("extracts").insert(row).select("id").single();
  if(r.error){err("تعذر الحفظ: "+r.error.message);return}
  eid=r.data.id;draw();err("تم الحفظ.",1)
}
function lines(){
  var L=[["مستخلص رقم",ex.no],["المشروع",ex.project],["المقاول",ex.contractor],["صاحب العمل",ex.client],["رقم العقد",ex.cno],["قيمة العقد",n(ex.cval)],["التاريخ",ex.date],[]];
  [["works","الأعمال التعاقدية"],["extras","أعمال إضافية"]].forEach(function(S){
    L.push([S[1]]);L.push(["الوصف","الوحدة","الكمية الإجمالية","الكمية السابقة","النسبة %","الفئة","المنفذة","الحالية","قيمة الفترة","الإجمالي"]);
    ex[S[0]].forEach(function(r){var c=rc(r);L.push([r.d,r.u,n(r.q),n(r.p),n(r.pc),n(r.pr),c.e,c.c,c.pv,c.v])})});
  L.push([],["الخصومات"]);ex.deds.forEach(function(r){L.push([r.d+(r.t=="p"?" ("+n(r.a)+"%)":""),dv(r)])});
  L.push([],["إجمالي قيمة الفترة",gross()],["إجمالي الخصومات",ded()],["صافي المستحق",net()],["إجمالي الأعمال المنفذة للآن",cum()]);
  return L
}
function xlsx(){
  var L=lines(),name="mostalkhas-"+(ex.no||"1");
  if(typeof XLSX=="undefined"){
    var s="\ufeff"+L.map(function(r){return r.map(function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv;charset=utf-8"}));a.download=name+".csv";a.click();return}
  var ws=XLSX.utils.aoa_to_sheet(L);ws["!views"]=[{rightToLeft:true}];ws["!cols"]=[{wch:30},{wch:10},{wch:14},{wch:14},{wch:10},{wch:12},{wch:14},{wch:14},{wch:16},{wch:16}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"مستخلص");wb.Workbook={Views:[{RTL:true}]};
  XLSX.writeFile(wb,name+".xlsx")
}
function tbl(S){
  var h='<h3>'+S[1]+'</h3><table><tr><th>الوصف</th><th>الوحدة</th><th>الكمية</th><th>السابقة</th><th>النسبة %</th><th>الفئة</th><th>المنفذة</th><th>الحالية</th><th>قيمة الفترة</th><th>الإجمالي</th></tr>';
  ex[S[0]].forEach(function(r){var c=rc(r);h+='<tr><td>'+esc(r.d)+'</td><td>'+esc(r.u)+'</td><td>'+f(n(r.q))+'</td><td>'+f(n(r.p))+'</td><td>'+n(r.pc)+'</td><td>'+f(n(r.pr))+'</td><td>'+f(c.e)+'</td><td>'+f(c.c)+'</td><td>'+f(c.pv)+'</td><td>'+f(c.v)+'</td></tr>'});
  return h+'<tr><th colspan="8">الإجمالي</th><th>'+f(sum(ex[S[0]],"pv"))+'</th><th>'+f(sum(ex[S[0]],"v"))+'</th></tr></table>'
}
function doPrint(){
  var co=cos.filter(function(c){return c.id==cid})[0];
  var h='<h2>'+esc(co?co.name:"")+' - مستخلص رقم '+esc(ex.no)+'</h2><div>المشروع: '+esc(ex.project)+' | المقاول: '+esc(ex.contractor)+' | صاحب العمل: '+esc(ex.client)+' | رقم العقد: '+esc(ex.cno)+' | قيمة العقد: '+f(n(ex.cval))+' | التاريخ: '+esc(ex.date)+'</div>';
  h+=tbl(["works","الأعمال التعاقدية"]);
  if(ex.extras.length)h+=tbl(["extras","أعمال إضافية"]);
  h+='<h3>الخصومات</h3><table><tr><th>البيان</th><th>القيمة</th></tr>';
  ex.deds.forEach(function(r){h+='<tr><td>'+esc(r.d)+(r.t=="p"?" ("+n(r.a)+"%)":"")+'</td><td>'+f(dv(r))+'</td></tr>'});
  h+='<tr><th>إجمالي الخصومات</th><th>'+f(ded())+'</th></tr></table>';
  h+='<table><tr><th>إجمالي قيمة الفترة</th><td>'+f(gross())+'</td><th>صافي المستحق</th><td>'+f(net())+'</td><th>إجمالي المنفذ للآن</th><td>'+f(cum())+'</td></tr></table>';
  h+='<div class="sig"><div>مدير المشروع<br><br>التوقيع: ........</div><div>مدير المكتب الفني<br><br>التوقيع: ........</div><div>المقاول<br><br>التوقيع: ........</div></div>';
  document.getElementById("pr").innerHTML=h;window.print()
}
document.addEventListener("input",function(e){var t=e.target;if(!ex)return;
  if(t.dataset.h)ex[t.dataset.h]=t.value;
  else if(t.dataset.s){ex[t.dataset.s][+t.dataset.i][t.dataset.k]=t.value;upd()}});
document.addEventListener("change",function(e){if(e.target.id=="co"){cid=e.target.value;list()}});
document.addEventListener("click",async function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.act=="new"){eid=null;ex={no:"",project:"",contractor:"",client:"",cno:"",cval:"",cdate:"",date:new Date().toISOString().slice(0,10),works:[blank()],extras:[],deds:[]};draw()}
  else if(d.open){var r=await db.from("extracts").select("id,data").eq("id",d.open).single();if(r.error){err(r.error.message);return}eid=r.data.id;ex=r.data.data;draw()}
  else if(d.add){if(d.add=="deds")ex.deds.push({d:"",a:"",t:"v"});else ex[d.add].push(blank());draw()}
  else if(d.pre){var p=d.pre.split("|");ex.deds.push({d:p[0],a:"",t:p[1]});draw()}
  else if(d.del){var q=d.del.split(":");ex[q[0]].splice(+q[1],1);draw()}
  else if(d.act=="save")save();
  else if(d.act=="print")doPrint();
  else if(d.act=="xlsx")xlsx();
  else if(d.act=="back")list();
  else if(d.act=="next"){
    var c=JSON.parse(JSON.stringify(ex));
    c.no=/^\d+$/.test(String(ex.no).trim())?String(+ex.no+1):"";
    c.date=new Date().toISOString().slice(0,10);
    ["works","extras"].forEach(function(s){c[s].forEach(function(r){r.p=String(Math.round(rc(r).e*1000)/1000)})});
    c.deds=c.deds.filter(function(r){return r.t=="p"});
    eid=null;ex=c;draw();err("جاهز: الكمية السابقة = المنفذة في المستخلص اللي قبله. عدّل النسب واحفظ.",1)}
  else if(d.act=="rm"){if(confirm("تمسح المستخلص نهائياً؟")){var r2=await db.from("extracts").delete().eq("id",eid);if(r2.error)err(r2.error.message);else list()}}
});
init();
</script></body></html>
