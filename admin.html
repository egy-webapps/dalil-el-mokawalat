<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2547">
<title>لوحة الأدمن - دليل المقاولات</title>
<style>
:root{--navy:#0f2547;--orange:#f37021;--bg:#eef1f5;--card:#fff;--text:#14213d;--muted:#6b7280;--border:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162036;--text:#f9fafb;--muted:#9ca3af;--border:#374151}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--navy);color:#fff;padding:20px 16px;border-bottom:4px solid var(--orange)}
header h1{margin:0;font-size:24px}
main{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:18px;margin-bottom:14px;border:1px solid var(--border)}
.card h2{margin:0 0 10px;font-size:20px}
.muted{color:var(--muted);font-size:14px;margin:0}
button{width:100%;margin-top:12px;padding:12px;font-size:16px;border:0;border-radius:8px;background:var(--orange);color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
button.sec{background:transparent;color:var(--orange);border:2px solid var(--orange)}
.msg{margin-top:14px;padding:12px;border-radius:8px;display:none;font-size:15px}
.msg.err{background:#fde8e8;color:#9b1c1c}
.msg.ok{background:#e1f5e7;color:#14532d}
.co{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px}
.co b{display:block;font-size:17px}
a{color:var(--orange);display:inline-block;margin-top:12px}
</style>
</head>
<body>
<header><h1>لوحة الأدمن</h1></header>
<main>
<div id="msg" class="msg" role="alert"></div>
<section class="card">
<h2>توثيق الشركات والاشتراكات</h2>
<p id="status" class="muted">جاري التحقق...</p>
<div id="list"></div>
<a href="index.html">الرجوع للموقع</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ymmyijtuaqkiyjenmgjh.supabase.co";
const SUPABASE_KEY = "sb_publishable_0T07DGMMB6Owg10Sl6zHyw_2PZLAgBL";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function msg(text, type){
  var m = document.getElementById("msg");
  m.textContent = text;
  m.className = "msg " + type;
  m.style.display = "block";
}
function line(parent, text){
  var d = document.createElement("div");
  d.className = "muted";
  d.textContent = text;
  parent.appendChild(d);
}

async function setStatus(id, status){
  var r = await db.rpc("admin_set_company_status", { p_company: id, p_status: status });
  if (r.error) { msg("حصل خطأ: " + r.error.message, "err"); return; }
  msg("تم تحديث حالة الشركة.", "ok");
  load();
}

async function setSub(id, active){
  var ends = null;
  if (active) {
    var d = new Date();
    d.setMonth(d.getMonth() + 1);
    ends = d.toISOString().slice(0, 10);
  }
  var r = await db.rpc("admin_set_company_subscription", { p_company: id, p_active: active, p_ends: ends });
  if (r.error) { msg("حصل خطأ: " + r.error.message, "err"); return; }
  msg(active ? "تم تفعيل الاشتراك لمدة شهر." : "تم إيقاف الاشتراك.", "ok");
  load();
}

async function load(){
  var list = document.getElementById("list");
  list.textContent = "";
  var r = await db.from("companies")
    .select("id,name,activity,governorate,verification_status,subscription_active,subscription_ends_at")
    .order("created_at", { ascending: false });
  if (r.error) { msg("تعذر تحميل الشركات: " + r.error.message, "err"); return; }
  if (!r.data.length) { line(list, "لا توجد شركات."); return; }
  r.data.forEach(function(c){
    var d = document.createElement("div");
    d.className = "co";
    var b = document.createElement("b");
    b.textContent = c.name || "-";
    d.appendChild(b);
    line(d, "النشاط: " + (c.activity || "-"));
    line(d, "المحافظة: " + (c.governorate || "-"));
    var ok = c.verification_status === "verified";
    line(d, "الحالة: " + (ok ? "موثّقة" : "غير موثّقة"));
    var btn = document.createElement("button");
    btn.textContent = ok ? "إلغاء التوثيق" : "توثيق الشركة";
    if (ok) btn.className = "sec";
    btn.addEventListener("click", function(){
      btn.disabled = true;
      setStatus(c.id, ok ? "unverified" : "verified");
    });
    d.appendChild(btn);

    var subOn = c.subscription_active === true;
    line(d, "الاشتراك: " + (subOn ? "مفعّل" + (c.subscription_ends_at ? " لحد " + c.subscription_ends_at : "") : "موقوف"));
    var sbtn = document.createElement("button");
    sbtn.textContent = subOn ? "إيقاف الاشتراك" : "تفعيل الاشتراك (شهر)";
    if (subOn) sbtn.className = "sec";
    sbtn.addEventListener("click", function(){
      sbtn.disabled = true;
      setSub(c.id, !subOn);
    });
    d.appendChild(sbtn);

    list.appendChild(d);
  });
}

async function init(){
  var status = document.getElementById("status");
  var s = await db.auth.getSession();
  if (!s.data.session) {
    status.textContent = "سجّل دخول بحساب الأدمن من الصفحة الرئيسية الأول، وبعدين ارجع هنا.";
    return;
  }
  var p = await db.from("profiles").select("platform_role").eq("id", s.data.session.user.id).single();
  if (p.error || !p.data || p.data.platform_role !== "admin") {
    status.textContent = "الحساب ده مش أدمن.";
    return;
  }
  status.textContent = "كل الشركات:";
  load();
}
init();
</script>
</body>
</html>
