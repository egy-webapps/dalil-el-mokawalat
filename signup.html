
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - دليل المقاولات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        h2 { color: #333; font-size: 24px; margin-bottom: 20px; }
        input { display: block; width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        button { display: block; width: 100%; padding: 12px; margin: 15px 0 10px 0; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; box-sizing: border-box; }
        button:hover { background-color: #218838; }
        a { color: #007bff; text-decoration: none; font-size: 14px; display: inline-block; margin-top: 10px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>إنشاء حساب جديد</h2>
        <form id="signupForm">
            <input type="text" placeholder="الاسم الكامل" required>
            <input type="email" placeholder="البريد الإلكتروني" required>
            <input type="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل</button>
        </form>
        <a href="index.html">العودة للرئيسية</a>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إنشاء الحساب بنجاح! أهلاً بك في دليل المقاولات');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
