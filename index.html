<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل المقاولات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-login { background-color: #007bff; color: white; }
        .btn-login:hover { background-color: #0056b3; }
        .btn-signup { background-color: #28a745; color: white; }
        .btn-signup:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="card">
        <h1>دليل المقاولات</h1>
        <p>كل المقاولات في مكان واحد</p>
        <a href="login.html" class="btn btn-login">تسجيل الدخول</a>
        <a href="signup.html" class="btn btn-signup">إنشاء حساب جديد</a>
    </div>
</body>
</html>
